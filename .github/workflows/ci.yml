name: Production CI/CD Quality Gate

on:
  push:
    branches: [main, master, release/*]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret & Credential Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  backend-quality:
    name: Backend Tests, Coverage & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install uv Package Manager
        run: pip install uv

      - name: Create Virtual Environment and Install Dependencies
        run: |
          uv venv .venv
          . .venv/bin/activate
          uv pip install -e "./backend[dev]" -e "./ml" bandit

      - name: Ruff Linter & Formatting Check
        run: |
          . .venv/bin/activate
          ruff check backend/app ml/src

      - name: Security Static Analysis (Bandit)
        run: |
          . .venv/bin/activate
          bandit -r backend/app -ll -x "backend/tests"

      - name: Run Backend Pytest Suite with Coverage
        run: |
          . .venv/bin/activate
          pytest backend/tests ml/tests --cov=app --cov=aiops_ml --cov-report=term-missing

  frontend-quality:
    name: Frontend Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: ESLint Check
        working-directory: ./frontend
        run: npm run lint

      - name: TypeScript Type Checking
        working-directory: ./frontend
        run: npm run typecheck

      - name: Vitest Unit Tests
        working-directory: ./frontend
        run: npm run test

      - name: Install Playwright Browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Production Next.js Build
        working-directory: ./frontend
        run: npm run build

  container-verification:
    name: Multi-stage Docker Builds
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          tags: aiops-sentinel-backend:ci-test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: aiops-sentinel-frontend:ci-test
