[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiops-sentinel-ml"
version = "0.1.0"
description = "AIOps Sentinel ML, Anomaly Detection & RCA Research Library"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.1",
    "networkx>=3.2.1",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aiops_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
