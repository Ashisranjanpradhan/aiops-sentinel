events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Structured JSON / standard access logging
    log_format production_json escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status": "$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log production_json;
    error_log /var/log/nginx/error.log warn;

    # Security Headers (OWASP Recommended)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Rate Limiting Zones (Leaky Bucket)
    limit_req_zone $binary_remote_addr zone=prod_auth_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=prod_api_limit:10m rate=40r/s;
    limit_req_zone $binary_remote_addr zone=prod_upload_limit:10m rate=5r/m;

    upstream backend_prod_upstream {
        server backend:8000;
        keepalive 32;
    }

    upstream frontend_prod_upstream {
        server frontend:3000;
        keepalive 32;
    }

    # ==============================================================================
    # 1. HTTP Server — Acme Challenge & Force HTTPS Redirect
    # ==============================================================================
    server {
        listen 80;
        server_name _;

        # Automated Let's Encrypt ACME verification
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        # Healthcheck endpoint (HTTP keepalive monitoring)
        location /healthz {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Permanent redirect all other traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ==============================================================================
    # 2. HTTPS Server — Production SSL/TLS Ingress
    # ==============================================================================
    server {
        listen 443 ssl http2;
        server_name _;

        # SSL Certificates (Mounted from volume)
        ssl_certificate /etc/nginx/ssl/sentinel.crt;
        ssl_certificate_key /etc/nginx/ssl/sentinel.key;

        # TLS Hardening
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:20m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Upload limit for codebase ZIP packages
        client_max_body_size 50M;

        # Authentication endpoints (Strict rate limit)
        location /api/v1/auth/login {
            limit_req zone=prod_auth_limit burst=10 nodelay;
            proxy_pass http://backend_prod_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Codebase Assessment upload endpoint (Dedicated burst limit)
        location /api/v1/assessments/upload {
            limit_req zone=prod_upload_limit burst=5 nodelay;
            proxy_pass http://backend_prod_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 300s;
            proxy_request_buffering off;
        }

        # General Backend API
        location /api/ {
            limit_req zone=prod_api_limit burst=60 nodelay;
            proxy_pass http://backend_prod_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 120s;
        }

        # Frontend Next.js Web Application
        location / {
            proxy_pass http://frontend_prod_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }
    }
}
