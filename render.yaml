services:
  # 1. FastAPI Backend API Service
  - type: web
    name: aiops-sentinel-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DEMO_MODE
        value: "false"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: aiops-sentinel-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: aiops-sentinel-redis
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "https://ashisranjanpradhan.github.io"

  # 2. Next.js 14 Frontend Console
  - type: web
    name: aiops-sentinel-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    region: oregon
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: aiops-sentinel-backend
          property: host

databases:
  - name: aiops-sentinel-db
    plan: free
    databaseName: aiops_sentinel_prod
    user: aiops_user
